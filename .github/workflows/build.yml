name: Build ASI

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile C++ to DLL/ASI
      run: |
        cl /LD /O2 /EHsc main.cpp User32.lib /link /OUT:SpeedBoost.asi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedBoost-ASI
        path: SpeedBoost.asi
